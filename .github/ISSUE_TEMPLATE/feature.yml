name: Feature request
description: Propose a new model, dataset or capability.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do and why the current API does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API you would like. Link a reference implementation if one exists.
    validations:
      required: true
