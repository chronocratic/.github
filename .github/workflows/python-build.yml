name: Build distribution

# Builds the sdist and wheel and uploads them as the `dist` artifact.
#
# PyPI trusted publishing does not support uploading from a reusable workflow,
# so the upload job stays in the calling repository: it needs this workflow,
# downloads `dist` and runs pypa/gh-action-pypi-publish. See
# workflow-templates/pypi-publish.yml.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for uv"
        required: false
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build package
        run: uv build
      - name: Validate with twine
        run: uvx twine check dist/*
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
